[project]
name = "noderag-northwind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "anthropic>=0.34",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "tqdm>=4.66",
    "sqlite-utils>=3.37",
    "pydantic>=2.8",
]

[project.scripts]
noderag = "cli:cli"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config"]

[tool.setuptools.packages.find]
where = ["."]
